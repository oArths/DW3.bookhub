<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha | BookHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/bookhub-auth.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <aside class="auth-brand" aria-label="BookHub">
      <div class="auth-brand-inner">
        <a class="auth-logo" href="login.html">BookHub</a>

        <div class="auth-hero">
          <h1>Registre os livros que você já leu.</h1>
          <p>Salve aqueles que você quer e compartilhe com seus amigos o que você achou bom.</p>
        </div>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-form-wrap auth-form-wrap--compact">
        <h2>Informe o código enviado ao seu e-mail</h2>
        <p class="auth-sub">
          Já possui conta? <a href="login.html">Faça login</a>
        </p>

        <div class="auth-message auth-message--error" data-auth-message hidden role="alert"></div>

        <form id="forgot-form">
          <div class="auth-field">
            <label for="email">Email</label>
            <div class="auth-input-wrap">
              <input type="email" id="email" name="email" autocomplete="email" placeholder="seu@email.com" required />
            </div>
          </div>

          <div class="auth-field">
            <label for="code">Código</label>
            <div class="auth-input-wrap">
              <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" maxlength="6" required />
            </div>
          </div>

          <button type="submit" class="auth-submit">Confirmar</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/auth-config.js"></script>
  <script>
    (function () {
      var form = document.getElementById("forgot-form");
      var msg = form.querySelector("[data-auth-message]");
      var cfg = window.AUTH_CONFIG;

      form.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        if (!form.reportValidity()) return;

        var email = form.email.value.trim().toLowerCase();
        var code = form.code.value.trim();
        var btn = form.querySelector('[type="submit"]');
        btn.disabled = true;

        try {
          if (!email || !code) throw new Error("Preencha o e-mail e o código.");
          var base = (cfg.apiBaseUrl || "").replace(/\/$/, "");
          var res = await fetch(base + cfg.endpoints.forgotPassword, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, code: code }),
          });

          if (!res.ok) throw new Error("Código inválido ou expirado.");
          msg.hidden = false;
          msg.className = "auth-message auth-message--success";
          msg.textContent = "Código validado. Agora redefina sua senha.";
          window.location.href = "nova-senha.html";
        } catch (e) {
          msg.hidden = false;
          msg.className = "auth-message auth-message--error";
          msg.textContent = e.message || "Erro ao validar código. Tente novamente.";
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
